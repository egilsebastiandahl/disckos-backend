spring.application.name=disckos-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Required because we map Kotlin enums onto PostgreSQL named enum types
# (event_type, scoring_format). Without this the PG JDBC driver sends string
# parameters as `varchar`, and PostgreSQL refuses to implicitly cast varchar
# into a named enum type, blowing up writes with:
#   ERROR: column "event_type" is of type event_type but expression is of type character varying
# stringtype=unspecified makes the driver send strings as `unknown`, letting
# PG cast to whatever the column declares.
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# Trygt startpunkt n�r du kobler mot ekte DB:
spring.jpa.hibernate.ddl-auto=validate

# Valgfritt (debug):
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true